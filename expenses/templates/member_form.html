{% extends "base.html" %}
{% block content %}
<p><a href="/group/?id={{ group.id }}">Back to {{ group.name }}</a></p>
<h2>Add a member to {{ group.name }}</h2>
{% if error %}
  <p>{{ error }}</p>
{% endif %}
<form action="/member/" method="get">
  <input type="hidden" name="id" value="{{ group.id }}"></input>
  <p>Username (exactly as it was registered): <input type="text" name="username"></input></p>
  <p><input type="submit" value="Add member!"></input></p>
</form>
{% endblock %}
