{% extends "base.html" %}
{% block content %}
<h2>My groups</h2>
<ul>
  {% for group in groups %}
    <li><a href="/group/?id={{ group.id }}">{{ group.name }}</a></li>
  {% empty %}
    <li>You are not in any group yet.</li>
  {% endfor %}
</ul>
<p><a href="{% url 'create_group' %}">Create a new group</a></p>
{% endblock %}
